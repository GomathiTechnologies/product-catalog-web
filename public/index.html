<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internet plans | Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="border-bottom bg-white">
    <nav class="container py-3 d-flex align-items-center gap-2" aria-label="Main navigation">
      <span class="brand-icon"><i class="bi bi-wifi" aria-hidden="true"></i></span>
      <span class="fw-bold fs-5">Product Catalog</span>
      <a href="/chat" class="ms-auto text-decoration-none fw-semibold">AI chat</a>
    </nav>
  </header>
  <main class="container py-5">
    <div class="intro mb-5">
      <p class="eyebrow mb-2">STAY CONNECTED</p>
      <h1 class="display-5 fw-bold mb-3">Internet for your everyday</h1>
      <p class="lead text-secondary mb-0">Explore our home internet plans and find the right connection for you.</p>
    </div>
    <section class="mb-5" aria-labelledby="province-heading">
      <p class="eyebrow mb-1">YOUR LOCATION</p>
      <h2 id="province-heading" class="h4 fw-bold">Choose your province or territory</h2>
      <p class="text-secondary">Select a location to see available plans.</p>
      <div id="provinces" class="province-grid" aria-label="Select a province or territory"></div>
    </section>
    <div class="d-flex align-items-end justify-content-between mb-3">
      <div><p class="eyebrow mb-1">OUR PLANS</p><h2 class="h4 fw-bold mb-0">Find your connection <span id="selected-province" class="text-secondary fs-6 fw-normal"></span></h2></div>
    </div>
    <div id="status" role="status" aria-live="polite" class="text-secondary py-4">Loading plans…</div>
    <div id="products" class="row g-4"></div>
    <div id="purchase-message" class="alert alert-info mt-4 d-none" role="status"></div>
  </main>
  <footer class="container border-top py-4 text-secondary small">&copy; Product Catalog</footer>
</body>
</html>
