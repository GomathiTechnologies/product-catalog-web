<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge chat | Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet">
  <script src="/knowledge-chat.js" defer></script>
</head>
<body>
  <header class="border-bottom bg-white">
    <nav class="container py-3 d-flex align-items-center gap-2" aria-label="Main navigation">
      <span class="brand-icon"><i class="bi bi-wifi" aria-hidden="true"></i></span>
      <span class="fw-bold fs-5">Product Catalog</span>
      <a href="/" class="ms-auto text-decoration-none fw-semibold">View plans</a>
      <a href="/chat" class="text-decoration-none fw-semibold">AI chat</a>
    </nav>
  </header>
  <main class="container py-5">
    <div class="intro mb-4">
      <p class="eyebrow mb-2">KNOWLEDGE CHAT</p>
      <h1 class="display-5 fw-bold mb-3">Ask about our services</h1>
      <p class="lead text-secondary">Get answers grounded in the product knowledge documents. Each question is answered independently.</p>
    </div>
    <div class="card plan-card p-4" style="max-width: 720px">
      <form id="knowledge-form">
        <label for="question" class="form-label fw-semibold">Your question</label>
        <textarea id="question" class="form-control mb-3" rows="3" required placeholder="Can I get a fixed IP address?"></textarea>
        <button class="btn btn-primary px-4" type="submit">Send</button>
      </form>
      <section id="conversation" class="mt-4 d-none" aria-label="Conversation" aria-live="polite" aria-relevant="additions text"></section>
    </div>
  </main>
</body>
</html>
